name: test (reusable, clue)

on:
  workflow_call:
    inputs:
      nim-version:
        description: 'Nim version to install and test against.'
        type: string
        default: 'stable'
      os:
        description: 'JSON array of {os} objects describing the runner matrix.'
        type: string
        default: '[{"os":"ubuntu-latest"},{"os":"windows-latest"},{"os":"macos-15"}]'
      pre-test-command:
        description: 'Optional command run before the test command (e.g. extra tool installs).'
        type: string
        default: ''
      cache:
        description: 'Cache the ~/.clue directory and Nim installation across runs.'
        type: boolean
        default: true
      pre-install-command:
        description: 'Optional command run before installing/building the package (e.g. build a C dependency).'
        type: string
        default: ''

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.os) }}
    steps:
      - uses: actions/checkout@v4

      - uses: $/
        with:
          nim-version: ${{ inputs.nim-version }}

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          # macOS no longer ships a linkable system libssl (removed from the
          # SDK), so install the keg-only Homebrew OpenSSL and wire it up. This
          # is a no-op on runners where openssl@3 is already installed.
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          prefix="$(brew --prefix)/opt/openssl@3"

          # Environment for any tool that honors these variables.
          echo "LIBRARY_PATH=${prefix}/lib${LIBRARY_PATH:+:${LIBRARY_PATH}}" >> "$GITHUB_ENV"
          echo "CPATH=${prefix}/include${CPATH:+:${CPATH}}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${prefix}/lib/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" >> "$GITHUB_ENV"

          # Inject -L/-I straight into every `nim` invocation via the user
          # config file, so `-lssl`/`-lcrypto` always resolve at link time even
          # if the environment variables above are not honored.
          mkdir -p "$HOME/.config/nim"
          cfg="$HOME/.config/nim/nim.cfg"
          if [[ ! -f "${cfg}" ]] || ! grep -q "openssl@3" "${cfg}"; then
            printf -- '--passL:"-L%s/lib"\n--passC:"-I%s/include"\n' "${prefix}" "${prefix}" >> "${cfg}"
          fi

          # Force the build architecture to match the host. On arm64 runners the
          # prebuilt Nim can emit x86_64 code (mismatched target CPU), which then
          # fails to link against the arm64 Homebrew OpenSSL keg.
          echo "host arch: $(uname -m)"
          echo "clang target: $(clang -dumpmachine 2>/dev/null || true)"
          if [[ -f "${GITHUB_WORKSPACE}/.nim_runtime/config/nim.cfg" ]]; then
            echo "prebuilt config cpu/os lines:"
            grep -iE 'cpu|os' "${GITHUB_WORKSPACE}/.nim_runtime/config/nim.cfg" || echo "(none)"
          fi
          if [[ "$(uname -m)" == "arm64" ]]; then
            if ! grep -q -- "--cpu:arm64" "${cfg}"; then
              printf -- '--cpu:arm64\n' >> "${cfg}"
            fi
            if ! grep -q -- "-arch arm64" "${cfg}"; then
              printf -- '--passC:"-arch arm64"\n--passL:"-arch arm64"\n' >> "${cfg}"
            fi
          fi
          cat "${cfg}"

      - name: Cache Clue
        if: inputs.cache && runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.clue
          key: ${{ runner.os }}-nim-${{ inputs.nim-version }}-clue-${{ hashFiles('**/*.clue', '**/clue.lock') }}
          restore-keys: |
            ${{ runner.os }}-nim-${{ inputs.nim-version }}-clue-
            ${{ runner.os }}-nim-clue-

      - name: Install clue
        shell: bash
        run: |
          set -eu
          os="${{ runner.os }}"
          arch="${{ runner.arch }}"
          case "${os}" in
            Linux)
              asset="clue_linux-x86_64"; ext="tar.gz"
              ;;
            macOS)
              case "${arch}" in
                X64)   asset="clue_macos-x86_64"; ext="tar.gz" ;;
                ARM64) asset="clue_macos-arm64";  ext="tar.gz" ;;
                *)     echo "ERROR: unsupported macOS arch: ${arch}"; exit 1 ;;
              esac
              ;;
            Windows)
              asset="clue_windows-x86_64"; ext="zip"
              ;;
            *)
              echo "ERROR: unsupported os: ${os}"; exit 1
              ;;
          esac

          url="https://github.com/openpeeps/clue/releases/latest/download/${asset}.${ext}"
          echo ">> downloading ${url}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl -fsSL "${url}" -o "${work}/clue.${ext}"

          if [[ "${ext}" == "zip" ]]; then
            win_zip="$(cygpath -w "${work}/clue.zip")"
            win_dest="$(cygpath -w "${work}")"
            powershell -NoProfile -Command "Expand-Archive -Force -LiteralPath '${win_zip}' -DestinationPath '${win_dest}'"
          else
            tar xzf "${work}/clue.${ext}" -C "${work}"
          fi

          bin="$(find "${work}" -type f \( -name 'clue' -o -name 'clue.exe' \) | head -n 1)"
          [[ -n "${bin}" ]] || { echo "ERROR: clue binary not found in archive"; exit 1; }
          chmod +x "${bin}"
          mkdir -p "$HOME/.clue/bin"
          target="$HOME/.clue/bin/clue"
          if [[ "${os}" == "Windows" ]]; then
            target="${target}.exe"
          fi
          install -m 0755 "${bin}" "${target}"
          echo "installed clue: ${target}"
          echo "$HOME/.clue/bin" >> "$GITHUB_PATH"

      - name: Pre-install
        if: inputs.pre-install-command != ''
        shell: bash
        run: ${{ inputs.pre-install-command }}

      - name: Install dependencies
        shell: bash
        run: clue install

      - name: Pre-test
        if: inputs.pre-test-command != ''
        run: ${{ inputs.pre-test-command }}

      - name: Test
        shell: bash
        run: clue test
