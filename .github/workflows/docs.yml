name: docs (reusable, nimble)

on:
  workflow_call:
    inputs:
      nim-version:
        description: 'Nim version used to generate the docs.'
        type: string
        default: 'stable'
      nim-src:
        description: >-
          Path to the main module, e.g. `src/myproject.nim`. If empty,
          defaults to `src/<repository-name>.nim`, with a trailing
          `-nim` suffix stripped (`xxx-nim` -> `src/xxx.nim`).
        type: string
        default: ''
      deploy-dir:
        description: 'Directory where the generated HTML docs are written.'
        type: string
        default: '.gh-pages'
      pre-docs-command:
        description: 'Optional command run before generating the docs (e.g. install extra tools).'
        type: string
        default: ''
      deploy:
        description: 'Deploy the generated docs to the publish branch.'
        type: boolean
        default: true
      publish-branch:
        description: 'Branch the docs are deployed to (gh-pages).'
        type: string
        default: 'gh-pages'

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: $/
        with:
          nim-version: ${{ inputs.nim-version }}

      - name: Install dependencies
        shell: bash
        run: nimble install -Y

      - name: Pre-docs
        if: inputs.pre-docs-command != ''
        run: ${{ inputs.pre-docs-command }}

      - name: Generate docs
        env:
          DEPLOY_DIR: ${{ inputs.deploy-dir }}
          REPO_NAME: ${{ github.event.repository.name }}
          NIM_SRC: ${{ inputs.nim-src }}
        shell: bash
        run: |
          set -eu
          nim_src="${NIM_SRC}"
          if [[ -z "${nim_src}" ]]; then
            # Nimble convention: repo `xxx-nim` ships module `src/xxx.nim`.
            nim_src="src/${REPO_NAME%-nim}.nim"
          fi
          doc_cmd="nim doc --index:on --project --path:. --out:${DEPLOY_DIR} ${nim_src}"
          echo ">> Running: ${doc_cmd}"
          eval "${doc_cmd}"

          main_html="${DEPLOY_DIR}/${REPO_NAME%-nim}.html"
          if [[ -f "${main_html}" ]]; then
            mv "${main_html}" "${DEPLOY_DIR}/index.html"
            esc="$(printf '%s' "${REPO_NAME%-nim}" | sed 's/[.[\*^$]/\\&/g')"
            sed -i "s/${esc}\.html/index.html/g" "${DEPLOY_DIR}/index.html"
            sed -i "s/${esc}\.html/index.html/g" "${DEPLOY_DIR}/theindex.html" || true
          fi

      - name: Deploy to GitHub Pages
        if: inputs.deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ inputs.deploy-dir }}
          publish_branch: ${{ inputs.publish-branch }}
