name: docs (reusable, clue)

on:
  workflow_call:
    inputs:
      nim-version:
        description: 'Nim version used to generate the docs.'
        type: string
        default: 'stable'
      nim-src:
        description: >-
          Path to the main module, e.g. `src/myproject.nim`. If empty,
          defaults to `src/<repository-name>.nim`.
        type: string
        default: ''
      deploy-dir:
        description: 'Directory where the generated HTML docs are written.'
        type: string
        default: '.gh-pages'
      pre-docs-command:
        description: 'Optional command run before generating the docs (e.g. install extra tools).'
        type: string
        default: ''
      deploy:
        description: 'Deploy the generated docs to the publish branch.'
        type: boolean
        default: true
      publish-branch:
        description: 'Branch the docs are deployed to (gh-pages).'
        type: string
        default: 'gh-pages'

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: $/
        with:
          nim-version: ${{ inputs.nim-version }}

      - name: Install clue
        shell: bash
        run: |
          set -eu
          os="${{ runner.os }}"
          arch="${{ runner.arch }}"
          case "${os}" in
            Linux)
              asset="clue_linux-x86_64"; ext="tar.gz"
              ;;
            macOS)
              case "${arch}" in
                X64)   asset="clue_macos-x86_64"; ext="tar.gz" ;;
                ARM64) asset="clue_macos-arm64";  ext="tar.gz" ;;
                *)     echo "ERROR: unsupported macOS arch: ${arch}"; exit 1 ;;
              esac
              ;;
            Windows)
              asset="clue_windows-x86_64"; ext="zip"
              ;;
            *)
              echo "ERROR: unsupported os: ${os}"; exit 1
              ;;
          esac

          url="https://github.com/openpeeps/clue/releases/latest/download/${asset}.${ext}"
          echo ">> downloading ${url}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl -fsSL "${url}" -o "${work}/clue.${ext}"

          if [[ "${ext}" == "zip" ]]; then
            win_zip="$(cygpath -w "${work}/clue.zip")"
            win_dest="$(cygpath -w "${work}")"
            powershell -NoProfile -Command "Expand-Archive -Force -LiteralPath '${win_zip}' -DestinationPath '${win_dest}'"
          else
            tar xzf "${work}/clue.${ext}" -C "${work}"
          fi

          bin="$(find "${work}" -type f \( -name 'clue' -o -name 'clue.exe' \) | head -n 1)"
          [[ -n "${bin}" ]] || { echo "ERROR: clue binary not found in archive"; exit 1; }
          chmod +x "${bin}"
          mkdir -p "$HOME/.clue/bin"
          target="$HOME/.clue/bin/clue"
          if [[ "${os}" == "Windows" ]]; then
            target="${target}.exe"
          fi
          install -m 0755 "${bin}" "${target}"
          echo "installed clue: ${target}"
          echo "$HOME/.clue/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        shell: bash
        run: clue install

      - name: Pre-docs
        if: inputs.pre-docs-command != ''
        run: ${{ inputs.pre-docs-command }}

      - name: Generate docs
        env:
          DEPLOY_DIR: ${{ inputs.deploy-dir }}
          REPO_NAME: ${{ github.event.repository.name }}
          NIM_SRC: ${{ inputs.nim-src }}
        shell: bash
        run: |
          set -eu
          nim_src="${NIM_SRC}"
          if [[ -z "${nim_src}" ]]; then
            nim_src="src/${REPO_NAME}.nim"
          fi
          doc_cmd="nim doc --index:on --project --path:. --out:${DEPLOY_DIR} ${nim_src}"
          echo ">> Running: ${doc_cmd}"
          eval "${doc_cmd}"

          main_html="${DEPLOY_DIR}/${REPO_NAME}.html"
          if [[ -f "${main_html}" ]]; then
            mv "${main_html}" "${DEPLOY_DIR}/index.html"
            esc="$(printf '%s' "${REPO_NAME}" | sed 's/[.[\*^$]/\\&/g')"
            sed -i "s/${esc}\.html/index.html/g" "${DEPLOY_DIR}/index.html"
            sed -i "s/${esc}\.html/index.html/g" "${DEPLOY_DIR}/theindex.html" || true
          fi

      - name: Deploy to GitHub Pages
        if: inputs.deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ inputs.deploy-dir }}
          publish_branch: ${{ inputs.publish-branch }}
