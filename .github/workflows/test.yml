name: test (reusable, nimble)

on:
  workflow_call:
    inputs:
      nim-version:
        description: 'Nim version to install and test against.'
        type: string
        default: 'stable'
      os:
        description: 'JSON array of {os} objects describing the runner matrix.'
        type: string
        default: '[{"os":"ubuntu-latest"},{"os":"windows-latest"},{"os":"macos-15"}]'
      pre-test-command:
        description: 'Optional command run before the test command (e.g. extra tool installs).'
        type: string
        default: ''
      cache:
        description: 'Cache the ~/.nimble directory across runs.'
        type: boolean
        default: true
      pre-install-command:
        description: 'Optional command run before installing/building the package (e.g. build a C dependency).'
        type: string
        default: ''

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.os) }}
    steps:
      - uses: actions/checkout@v4

      - uses: $/
        with:
          nim-version: ${{ inputs.nim-version }}

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          # macOS no longer ships a linkable system libssl (removed from the
          # SDK), so install the keg-only Homebrew OpenSSL and wire it up. This
          # is a no-op on runners where openssl@3 is already installed.
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          prefix="$(brew --prefix)/opt/openssl@3"

          # Environment for any tool that honors these variables.
          echo "LIBRARY_PATH=${prefix}/lib${LIBRARY_PATH:+:${LIBRARY_PATH}}" >> "$GITHUB_ENV"
          echo "CPATH=${prefix}/include${CPATH:+:${CPATH}}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${prefix}/lib/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" >> "$GITHUB_ENV"

          # Inject -L/-I straight into every `nim` invocation via the user
          # config file, so `-lssl`/`-lcrypto` always resolve at link time even
          # if the environment variables above are not honored.
          mkdir -p "$HOME/.config/nim"
          cfg="$HOME/.config/nim/nim.cfg"
          if [[ ! -f "${cfg}" ]] || ! grep -q "openssl@3" "${cfg}"; then
            printf -- '--passL:"-L%s/lib"\n--passC:"-I%s/include"\n' "${prefix}" "${prefix}" >> "${cfg}"
          fi

          # Force the build architecture to match the host. On arm64 runners the
          # prebuilt Nim can emit x86_64 code (mismatched target CPU), which then
          # fails to link against the arm64 Homebrew OpenSSL keg.
          echo "host arch: $(uname -m)"
          echo "clang target: $(clang -dumpmachine 2>/dev/null || true)"
          if [[ -f "${GITHUB_WORKSPACE}/.nim_runtime/config/nim.cfg" ]]; then
            echo "prebuilt config cpu/os lines:"
            grep -iE 'cpu|os' "${GITHUB_WORKSPACE}/.nim_runtime/config/nim.cfg" || echo "(none)"
          fi
          if [[ "$(uname -m)" == "arm64" ]] && ! grep -q -- "-arch arm64" "${cfg}"; then
            printf -- '--passC:"-arch arm64"\n--passL:"-arch arm64"\n' >> "${cfg}"
          fi
          cat "${cfg}"

      - name: Cache nimble
        if: inputs.cache && runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nim-${{ inputs.nim-version }}-nimble-${{ hashFiles('**/*.nimble', '**/nimble.lock') }}
          restore-keys: |
            ${{ runner.os }}-nim-${{ inputs.nim-version }}-nimble-
            ${{ runner.os }}-nimble-

      - name: Pre-install
        if: inputs.pre-install-command != ''
        shell: bash
        run: ${{ inputs.pre-install-command }}

      - name: Install dependencies
        shell: bash
        run: nimble install -Y

      - name: Pre-test
        if: inputs.pre-test-command != ''
        run: ${{ inputs.pre-test-command }}

      - name: Test
        shell: bash
        run: nimble test
