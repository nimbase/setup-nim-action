name: test (reusable)

on:
  workflow_call:
    inputs:
      nim-version:
        description: 'Nim version to install and test against.'
        type: string
        default: 'stable'
      os:
        description: 'JSON array of {os} objects describing the runner matrix.'
        type: string
        default: '[{"os":"ubuntu-latest"},{"os":"windows-latest"},{"os":"macos-15"}]'
      install-command:
        description: 'Command that installs the package dependencies. Overrides the default nimble command when set (e.g. a clue command).'
        type: string
        default: 'nimble install -Y'
      pre-test-command:
        description: 'Optional command run before the test command (e.g. extra tool installs).'
        type: string
        default: ''
      test-command:
        description: 'Command that runs the package tests. Overrides the default nimble command when set (e.g. a clue command).'
        type: string
        default: 'nimble test'
      cache:
        description: 'Cache the ~/.nimble directory across runs.'
        type: boolean
        default: true
      pre-install-command:
        description: 'Optional command run before installing/building the package (e.g. build a C dependency).'
        type: string
        default: ''

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.os) }}
    steps:
      - uses: actions/checkout@v4

      - uses: $/
        with:
          nim-version: ${{ inputs.nim-version }}

      - name: Cache nimble
        if: inputs.cache && runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nim-${{ inputs.nim-version }}-nimble-${{ hashFiles('**/*.nimble', '**/nimble.lock') }}
          restore-keys: |
            ${{ runner.os }}-nim-${{ inputs.nim-version }}-nimble-
            ${{ runner.os }}-nimble-

      - name: Pre-install
        if: inputs.pre-install-command != ''
        shell: bash
        run: ${{ inputs.pre-install-command }}

      - name: Install dependencies
        if: inputs.install-command != ''
        shell: bash
        run: ${{ inputs.install-command }}

      - name: Pre-test
        if: inputs.pre-test-command != ''
        run: ${{ inputs.pre-test-command }}

      - name: Test
        shell: bash
        run: ${{ inputs.test-command }}
